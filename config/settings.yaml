# Kalshi API credentials are loaded from environment variables.
# Copy this file to .env and export the values before running.

kalshi:
  access_key: your_api_key_id
  private_key_path: /path/to/kalshi_private_key.pem
  ws_url: wss://external-api-ws.kalshi.com/trade-api/ws/v2
  series_ticker: KXWCADVANCE
